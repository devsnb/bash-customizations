# ~/.config/starship.toml
#
# Starship prompt configuration.
# Starship version: v1.25.1  (https://starship.rs/config/)
#
# This file is placed here for version control; the setup script symlinks it to
# ~/.config/starship.toml (or copies it if symlinking isn't possible).
#
# Colour palette: Catppuccin Mocha  https://catppuccin.com/palette
# ─────────────────────────────────────────────────────────────────────────────

# ── Global ────────────────────────────────────────────────────────────────────

# Add a blank line before each prompt line for breathing room.
add_newline = true

# Maximum time (ms) to wait for a module's shell command before timing out.
command_timeout = 1000

# Overall prompt format — modules are rendered left-to-right in this order.
# Each $module name corresponds to a [module] section below.
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$golang\
$java\
$docker_context\
$fill\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

# ── Palette ───────────────────────────────────────────────────────────────────
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

# ── Modules ───────────────────────────────────────────────────────────────────

[os]
disabled = true
style    = "bold blue"

[os.symbols]
Linux   = " "
Macos   = " "
Windows = " "

[username]
show_always = false          # only show when not the default user
style_user  = "bold green"
style_root  = "bold red"
format      = "[$user]($style) "

[hostname]
ssh_only  = true             # only show when connected via SSH
style     = "bold yellow"
format    = "[$ssh_symbol$hostname]($style) "

[directory]
style            = "bold blue"
read_only        = " 󰌾"
truncation_length = 4         # show last 4 path components
truncate_to_repo = true       # shorten inside a git repo to repo root
format           = "[$path]($style)[$read_only](red) "

[git_branch]
symbol = " "
style  = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style     = "bold red"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
staged    = "[+$count](green) "
modified  = "[~$count](yellow) "
untracked = "[?$count](overlay1) "
deleted   = "[-$count](red) "
stashed   = "[󰏖 $count](teal) "
format    = "[$all_status$ahead_behind]($style) "

[git_state]
style  = "bold yellow"
# Note: \\( and \\) in TOML produce \( and \) in the string value.
# Starship interprets \( and \) as literal parentheses (not optional-group syntax),
# displaying output like: (REBASE 2/5)
# Do NOT simplify to ( ) — Starship would misparse them as optional segments.
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[fill]
symbol = " "

[cmd_duration]
min_time           = 2000    # only show for commands taking > 2 s
style              = "bold yellow"
format             = "[ $duration]($style) "
show_milliseconds  = false

[jobs]
symbol          = " "
style           = "bold blue"
number_threshold = 1
format          = "[$symbol$number]($style) "

[time]
disabled        = false
time_format     = "%H:%M"
style           = "bold overlay1"
format          = "[$time]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
# vimcmd_symbol is shown when ble.sh vi mode is active (bleopt default_keymap=vi
# in .blerc) or when using readline vi mode (bindings.sh).
# Unused unless vi mode is explicitly enabled — safe to leave configured.
vimcmd_symbol  = "[❮](bold mauve)"

# ── Language / runtime modules ────────────────────────────────────────────────

[python]
symbol          = " "
style           = "bold yellow"
format          = "[$symbol($virtualenv )]($style)"
detect_files    = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version", "Pipfile"]
python_binary   = ["python3", "python"]

[nodejs]
symbol       = " "
style        = "bold green"
format       = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc", ".node-version"]

[rust]
symbol       = " "
style        = "bold peach"
format       = "[$symbol($version )]($style)"

[golang]
symbol       = " "
style        = "bold sky"
format       = "[$symbol($version )]($style)"

[java]
symbol       = " "
style        = "bold red"
format       = "[$symbol($version )]($style)"

[docker_context]
symbol       = " "
style        = "bold blue"
format       = "[$symbol$context]($style) "
only_with_files = true
